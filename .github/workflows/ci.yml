name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.4.2
      - name: Format check
        run: opa fmt --list --fail .
      - name: Strict check
        run: opa check --strict .
      - name: Tests
        run: opa test -v .
