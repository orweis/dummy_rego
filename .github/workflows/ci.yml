name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.x
      - name: Format check
        run: opa fmt --list --fail .
      - name: Strict check
        run: opa check --strict .
      - name: Tests
        run: opa test -v .
